# Once a day, saves GitHub data the website reads, so visitors don't call GitHub's API themselves
# (it allows only 60 requests an hour per network):
#   pinned.json       - the repos pinned on your profile, in order (shown in Projects)
#   data/github.json  - your profile and project list, with every language each project uses
name: Sync GitHub data

on:
  schedule:
    - cron: "17 6 * * *"   # once a day
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned repos
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          gh api graphql -f login="$OWNER" -f query='
            query($login: String!) {
              user(login: $login) {
                pinnedItems(first: 6, types: REPOSITORY) {
                  nodes { ... on Repository { name } }
                }
              }
            }' > response.json
          jq -c '[.data.user.pinnedItems.nodes[].name]' response.json > pinned.json
          rm response.json
          cat pinned.json

      - name: Fetch profile and project list
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          mkdir -p data
          gh api "users/$OWNER" > user.json
          gh api "users/$OWNER/repos?per_page=100&sort=pushed" > repos.json
          # Every language in each repo, most code first
          echo '{}' > langs.json
          for name in $(jq -r '.[].name' repos.json); do
            gh api "repos/$OWNER/$name/languages"               | jq --arg n "$name" '{($n): (to_entries | sort_by(-.value) | map(.key))}' > one.json
            jq -s '.[0] * .[1]' langs.json one.json > merged.json && mv merged.json langs.json
          done
          # Keep only the fields the website uses
          jq -c --slurpfile u user.json --slurpfile l langs.json '{
              user: ($u[0] | {login, html_url, avatar_url, bio, created_at}),
              repos: [.[] | {name, description, language, html_url, homepage, has_pages, fork, archived, created_at, pushed_at, topics,
                             languages: ($l[0][.name] // [])}]
            }' repos.json > data/github.json
          rm user.json repos.json langs.json one.json
          jq '.repos | length' data/github.json

      - name: Commit if changed
        run: |
          git add pinned.json data/github.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update GitHub data"
          git push
