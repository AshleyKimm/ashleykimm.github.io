<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ashley Kim</title>
    <meta name="description" content="Computer Engineering at the University of Waterloo. Experience, projects and playable demos.">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon.png">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <!-- Link preview card (LinkedIn, Discord, iMessage, ...) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Ashley Kim">
    <meta property="og:title" content="Ashley Kim">
    <meta property="og:description" content="Computer Engineering at the University of Waterloo. Experience, projects and playable demos.">
    <meta property="og:url" content="https://ashleykimm.github.io/">
    <meta property="og:image" content="https://ashleykimm.github.io/images/og-card.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Pixel-art Ashley saying Hi, I'm Ashley! in a speech bubble">
    <meta name="twitter:card" content="summary_large_image">
    <script>
        // Pick day/night before first paint: saved choice, else the system setting
        (function () {
            let t = null;
            try { t = localStorage.getItem("theme"); } catch (e) {}
            if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            document.documentElement.dataset.theme = t;
        })();
    </script>
    <link rel="stylesheet" href="style.css">
</head>

<body data-page="home" class="home">
    <!-- Day/night toggle, floating in the top-right corner -->
    <button class="icon-btn theme-float" id="theme"></button>

    <!-- The whole home page is one scene. On a fresh visit the camera starts high in the sky
         and slowly pans down to the ground (see the intro in common.js). -->
    <main class="hero home-scene" id="top">
        <div class="world" id="world">
            <div class="stars" aria-hidden="true"></div>
            <div class="orb" aria-hidden="true"></div>
            <div class="cloud c1" aria-hidden="true"></div>
            <div class="cloud c2" aria-hidden="true"></div>
            <div class="cloud c3" aria-hidden="true"></div>
            <div class="cloud c4" aria-hidden="true"></div>
            <div class="cloud c5" aria-hidden="true"></div>
            <div class="cloud c6" aria-hidden="true"></div>
            <!-- Ashley walks in, says hi in the bubble, then walks with the arrow keys or A / D (see common.js) -->
            <div class="walker" id="walker">
                <img src="images/avatar-full_body.png" alt="Pixel-art Ashley" width="250" height="250" draggable="false">
                <!-- Flashes above her head once she's said hi; clicking it (or her) tells more about me -->
                <button class="click-me" id="click-me" type="button" aria-label="Tell me more about Ashley" hidden>click!</button>
            </div>
            <div class="bubble" id="bubble" hidden>
                <h1 class="bubble-text" aria-label="Hi, I'm Ashley!"><span id="bubble-text" data-text="Hi, I'm Ashley!" aria-hidden="true"></span><span class="caret" aria-hidden="true"></span></h1>
                <!-- More about me: typed out below the greeting after a click. Edit the text in data-text (&#10; = new line). -->
                <p class="bubble-more" id="bubble-more" aria-live="polite" hidden><span id="bubble-more-text" aria-hidden="true"
                    data-text="I'm a Computer Engineering student at the University of Waterloo!&#10;I like building things that are reliable and actually get used. Lately I've been experimenting with AI agents, using them to turn my ideas into real projects. So stay tuned!"></span><span class="caret" aria-hidden="true"></span></p>
                <p class="bubble-hint">Use the arrow keys or A / D to walk around</p>
            </div>
            <div class="ground" aria-hidden="true"></div>
        </div>
    </main>

    <script src="arcade.js"></script>
    <script src="common.js"></script>
    <script>
        // Old links to sections of the home page now go to their own pages
        const moved = { "#experience": "experience", "#projects": "projects" }[location.hash];
        if (moved) location.replace(PAGES[moved]);
        // Fetch the project data in the background, so Projects and Arcade open with it ready (no pop-in mid-slide)
        addEventListener("load", () => setTimeout(() => loadGitHub().catch(() => {}), 1500));
    </script>
</body>
</html>
