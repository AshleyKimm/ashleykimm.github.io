<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ashley Kim</title>
    <meta name="description" content="Computer Engineering at the University of Waterloo. Experience, projects and playable demos.">
    <link rel="icon" type="image/png" href="avatar.png">
    <!-- Link preview card (LinkedIn, Discord, iMessage, ...) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Ashley Kim">
    <meta property="og:title" content="Ashley Kim">
    <meta property="og:description" content="Computer Engineering at the University of Waterloo. Experience, projects and playable demos.">

    <meta property="og:image:alt" content="Pixel-art Ashley next to a wooden sign reading Ashley Kim">
    <meta name="twitter:card" content="summary_large_image">
    <script>
        // Pick day/night before first paint: saved choice, else the system setting
        (function () {
            let t = null;
            try { t = localStorage.getItem("theme"); } catch (e) {}
            if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            document.documentElement.dataset.theme = t;
        })();
    </script>
    <link rel="stylesheet" href="style.css">
</head>

<body data-page="home" class="home">
    <nav>
        <div class="wrap">
            <a class="logo" href="./" data-page="home">ashley kim</a>
            <button class="icon-btn" id="theme"></button>
        </div>
    </nav>

    <!-- The whole home page is one scene. On a fresh visit the camera starts high in the sky
         and slowly pans down to the ground (see the intro in common.js). -->
    <main class="hero home-scene" id="top">
        <div class="world" id="world">
            <div class="stars" aria-hidden="true"></div>
            <div class="orb" aria-hidden="true"></div>
            <div class="cloud c1" aria-hidden="true"></div>
            <div class="cloud c2" aria-hidden="true"></div>
            <div class="cloud c3" aria-hidden="true"></div>
            <div class="cloud c4" aria-hidden="true"></div>
            <div class="cloud c5" aria-hidden="true"></div>
            <div class="cloud c6" aria-hidden="true"></div>
            <div class="wrap hero-inner">
            <div class="scene">
                <div class="sign-col">
                    <div class="sign">
                        <div class="eyebrow">Computer Engineering @ University of Waterloo</div>
                        <h1>Hi, I'm Ashley!</h1>
                        <div class="btns">
                            <a class="btn primary" href="projects" data-page="projects">See my projects</a>
                            <a class="btn" href="https://github.com/AshleyKimm" target="_blank" rel="noopener">GitHub</a>
                            <a class="btn" href="https://linkedin.com/in/ashkimm" target="_blank" rel="noopener">LinkedIn</a>
                            <a class="btn" href="mailto:a238kim@uwaterloo.ca">Email</a>
                        </div>
                    </div>
                    <div class="posts" aria-hidden="true"></div>
                </div>
                <div class="hero-avatar"><img src="avatar.png" alt="Pixel-art Ashley" width="250" height="250" draggable="false"></div>
            </div>
            </div>
            <div class="ground" aria-hidden="true"></div>
        </div>
    </main>

    <script src="arcade.js"></script>
    <script src="common.js"></script>
    <script>
        // Old links to sections of the home page now go to their own pages
        const moved = { "#experience": "experience", "#projects": "projects" }[location.hash];
        if (moved) location.replace(PAGES[moved]);
    </script>
</body>
</html>
